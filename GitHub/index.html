<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TREE CHARGE</title>
<meta name="theme-color" content="#0b4f1d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TREE CHARGE">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0b4f1d;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:linear-gradient(135deg,#0b4f1d,#178a30,#5cbf2e);color:#fff;font-family:"Noto Sans Lao","Noto Sans Thai",system-ui,sans-serif;transition:opacity .4s}
  #splash.hide{opacity:0;pointer-events:none}
  .ring{position:relative;width:160px;height:160px;display:grid;place-items:center}
  .ring svg{position:absolute;inset:0;animation:spin 1.2s linear infinite}
  .ring span{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 28px rgba(0,0,0,.25)}
  .ring img{width:92px;height:92px;object-fit:contain}
  #splash b{font-size:24px;letter-spacing:.5px}
  #splash small{opacity:.85}
  #err{display:none;text-align:center;padding:0 24px}
  #err button{margin-top:12px;height:44px;padding:0 22px;border:0;border-radius:12px;background:#fff;color:#136b26;font-weight:700;font-size:16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #scan{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
  #scan.on{display:flex}
  #scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #scan .box{position:relative;width:min(70vw,280px);aspect-ratio:1;border-radius:22px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);border:3px solid #5cbf2e}
  #scan .line{position:absolute;left:8%;right:8%;height:3px;background:#5cbf2e;box-shadow:0 0 12px #5cbf2e;animation:sl 1.8s ease-in-out infinite alternate}
  #scan p{position:relative;color:#fff;font:600 16px "Noto Sans Lao","Noto Sans Thai",system-ui,sans-serif;text-align:center;margin:26px 24px 0}
  #scan button{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:24px;line-height:1}
  @keyframes sl{from{top:8%}to{top:90%}}

</style>
</head>
<body>
<div id="splash">
  <div class="ring">
    <svg width="160" height="160" viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="72" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="6"/><circle cx="80" cy="80" r="72" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="110 400"/></svg>
    <span><img src="icons/logo.png" alt="TREE CHARGE"></span>
  </div>
  <b>TREE CHARGE STATION</b>
  <small id="msg">ກຳລັງເປີດ… · กำลังเปิด…</small>
  <div id="err">ກວດອິນເຕີເນັດ ແລ້ວລອງໃໝ່ · ตรวจอินเทอร์เน็ตแล้วลองใหม่<br><button onclick="location.reload()">↻</button></div>
</div>
<iframe id="app" title="TREE CHARGE" allow="geolocation; camera; clipboard-read; clipboard-write; fullscreen"></iframe>
<div id="scan" role="dialog" aria-label="QR"><video id="cam" playsinline muted></video><div class="box"><div class="line"></div></div><p id="scanTxt">ສ່ອງກ້ອງໃສ່ QR ທີ່ຫົວສາກ</p><button id="scanX" aria-label="close">×</button></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="config.js"></script>
<script>
  // the app itself runs on Google Apps Script; this page only shows it full screen with our own icon
  var page = '';
  var q = new URLSearchParams(location.search);
  var url = APP_URL + (page ? '?page=' + page : '') + (q.get('c') ? (page ? '&' : '?') + 'c=' + encodeURIComponent(q.get('c')) : '');
  var f = document.getElementById('app'), s = document.getElementById('splash');
  f.addEventListener('load', function () { setTimeout(function () { s.classList.add('hide'); }, 600); });
  setTimeout(function () { if (!s.classList.contains('hide')) { document.getElementById('err').style.display = 'block'; } }, 25000);
  f.src = url;

  /* ---- QR camera: opened here because Google's frame inside can't use the camera ---- */
  var appWin = null, stream = null, timer = null;
  var TXT = { lo: 'ສ່ອງກ້ອງໃສ່ QR ທີ່ຫົວສາກ', th: 'ส่องกล้องไปที่ QR ที่หัวชาร์จ', en: 'Point the camera at the QR on the charger', zh: '将摄像头对准充电枪上的二维码' };
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.tc === 'hello') { appWin = e.source; try { appWin.postMessage({ tc: 'wrapper' }, '*'); } catch (x) {} }
    if (d.tc === 'scan') { appWin = e.source; openScan(d.lang); }
  });
  function send(m) { try { appWin && appWin.postMessage(m, '*'); } catch (x) {} }
  function closeScan() { clearInterval(timer); if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; document.getElementById('scan').classList.remove('on'); }
  document.getElementById('scanX').onclick = closeScan;
  function openScan(lang) {
    document.getElementById('scanTxt').textContent = TXT[lang] || TXT.lo;
    var v = document.getElementById('cam'), box = document.getElementById('scan');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { send({ tc: 'scanFail' }); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then(function (st) {
      stream = st; v.srcObject = st; box.classList.add('on'); v.play();
      var det = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
      var cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
      var found = function (txt) { closeScan(); try { navigator.vibrate && navigator.vibrate(120); } catch (x) {} send({ tc: 'code', code: txt }); };
      timer = setInterval(function () {
        if (!v.videoWidth) return;
        if (det) { det.detect(v).then(function (r) { if (r && r[0]) found(r[0].rawValue); }).catch(function () {}); return; }
        if (!window.jsQR) return;
        var w = 480, h = Math.round(v.videoHeight * w / v.videoWidth); cv.width = w; cv.height = h;
        cx.drawImage(v, 0, 0, w, h);
        var q = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
        if (q && q.data) found(q.data);
      }, 300);
    }).catch(function () { send({ tc: 'scanFail' }); });
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
